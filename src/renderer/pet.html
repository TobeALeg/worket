<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worket</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <main id="pet-root" class="pet-root">
      <section id="context-bubble" class="context-bubble" aria-live="polite" hidden>
        <span id="application-mark" class="application-mark" aria-hidden="true">
          <img id="application-icon" class="application-icon" alt="" hidden />
          <span id="application-symbol" class="application-symbol" hidden></span>
        </span>
        <span class="context-copy">
          <small id="context-label" hidden></small>
          <strong id="context-title"></strong>
          <span id="waiting-dots" class="waiting-dots" aria-label="等待选择聊天" hidden><i></i><i></i><i></i></span>
        </span>
      </section>
      <div class="pet-anchor"><div id="pet" class="pet sleeping">
        <button id="pet-body" class="pet-body" aria-label="打开 Worket">
          <span id="pet-visual" class="pet-visual" aria-hidden="true"></span>
        </button>
        <button id="paper-action" class="paper-action" aria-label="查看当前活动" disabled>
          <strong id="paper-label">查看</strong>
        </button>
      </div></div>
    </main>
    <script type="module" src="pet.js"></script>
  </body>
</html>
