<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worket · 浮窗审阅</title>
<style>
:root{--paper:#fbfaf7;--ink:#343d36;--muted:#92968c;--line:#e8e8e0;--green:#38634b;--amber:#aa7b39;--soft:#f5eedf}*{box-sizing:border-box}body{margin:0;background:#eaece7;color:var(--ink);font:12px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;height:100dvh;display:grid;place-items:center;padding:20px}button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}button:focus-visible{outline:2px solid var(--green);outline-offset:2px}button:disabled{opacity:.35;cursor:default}svg{width:13px;height:13px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.widget{width:410px;max-width:100%;max-height:calc(100dvh - 55px);background:var(--paper);border:1px solid #d9ddd3;border-radius:13px;box-shadow:0 18px 60px #24342b1c,0 2px 8px #24342b08;display:flex;flex-direction:column;overflow:hidden}.bar{height:38px;flex-shrink:0;padding:0 17px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line);user-select:none}.logo{display:inline-flex;align-items:center;justify-content:center;width:25px;height:23px;background:#dfca8d;border-radius:45%;font-size:14px;color:#79632e}.brand{font-weight:750;font-size:16px;letter-spacing:-.6px}.bar-label{font-size:10px;color:var(--muted);margin-left:3px}.bar-actions{margin-left:auto;display:flex;gap:9px}.icon{width:22px;height:23px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}.icon:hover{background:#eeefe8;color:var(--ink)}.title{padding:15px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:18px;letter-spacing:-.5px;margin:0;font-weight:650}.count{font-size:10px;color:var(--amber);white-space:nowrap}.content{padding:0 18px 6px;overflow:auto;min-height:0}.group{display:grid;grid-template-columns:51px minmax(0,1fr);border-top:1px solid var(--line)}.label{font-size:10px;color:var(--muted);padding-top:10px;display:flex;align-items:baseline;gap:5px}.label-icon{font-size:12px;color:#929e8b;width:11px;text-align:center}.items{padding:4px 0;min-width:0}.row{display:flex;align-items:center;gap:6px;min-height:29px}.row-text{flex:1;min-width:0;font-size:12px}.meta{font-size:10px;color:#969b90;white-space:nowrap}.item{padding:6px 0}.item .row{min-height:22px}.issue-name{display:flex;gap:6px;align-items:center}.dot{width:4px;height:4px;background:var(--amber);border-radius:50%;flex-shrink:0}.resolved .dot{background:#91a086}.evidence-button{color:#a6a99e;flex-shrink:0;width:22px;height:22px;display:grid;place-items:center;border-radius:4px}.evidence-button:hover,.evidence-button[aria-expanded=true]{background:#eceee5;color:var(--green)}.choices{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #e5dece;border-radius:5px;background:#f8f4e9;margin-top:5px;overflow:hidden}.choices button{font-size:10px;padding:5px 1px;white-space:nowrap;line-height:1.5}.choices button+button{border-left:1px solid #e5dece}.choices button:hover{background:#ece6d6}.choices button.chosen{background:#e2eadc;color:var(--green)}.decision{display:flex;align-items:center;gap:4px;margin-top:4px}.decision .chip{font-size:10px;padding:2px 6px;background:#eaf0e5;color:var(--green);border-radius:4px}.decision .chip:hover{background:#dfe9d7}.undo{font-size:12px;color:#b0b4a9;padding:1px 4px;line-height:18px}.undo:hover{color:var(--ink)}.evidence{background:#f0f1eb;border-radius:5px;font-size:10px;color:#78816f;padding:8px 10px;margin-top:6px}.evidence p{margin:3px 0 0;color:#586151;line-height:1.6}.evidence mark{background:#e5dfb9;color:inherit;padding:0 2px}.extra{color:var(--green)}.removed .row-text{text-decoration:line-through;color:#a3a698}.footer{flex-shrink:0;border-top:1px solid var(--line);padding:11px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px}.footer-status{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}.steps{display:flex;gap:3px}.steps i{width:9px;height:3px;border-radius:2px;background:#dddccb}.steps i.done{background:#6e8d65}.actions{display:flex;gap:8px}.secondary{padding:5px 7px;font-size:11px;color:#7f8977}.primary{border-radius:5px;background:var(--green);color:white;font-size:11px;padding:6px 13px}.primary:hover:not(:disabled){background:#2b513c}.prototype{position:fixed;bottom:9px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2px;color:#9b9e95;pointer-events:none}.notice{font-size:10px;color:var(--green);text-align:center;padding:0 18px 9px}.notice:empty{display:none}.collapsed .title,.collapsed .content,.collapsed .footer,.collapsed .notice{display:none}.collapsed .bar{border:0}.collapsed{width:170px}.widget.published .count{color:var(--green)}@media(max-width:440px){body{padding:12px}.widget{width:100%}.content{padding-inline:14px}.title{padding-inline:14px}.group{grid-template-columns:46px minmax(0,1fr)}.row-text{font-size:11px}.meta{font-size:9px}}@media(max-height:640px){.bar{height:33px}.title{padding-block:10px}.row{min-height:25px}.items{padding-block:3px}.item{padding-block:4px}.footer{padding-block:8px}}

.stage{width:410px;max-width:100%;position:relative}.widget{position:relative;width:var(--panel-width,410px);max-width:none}.widget.collapsed{width:170px}.resize-handle{position:absolute;right:0;top:39px;bottom:53px;width:9px;cursor:ew-resize;touch-action:none;z-index:4;display:flex;align-items:center;justify-content:center}.resize-handle::after{content:"";height:24px;width:2px;border-radius:2px;background:#b7beb0;opacity:.5}.resize-handle:hover::after,.resize-handle:focus-visible::after{background:var(--green);opacity:1}.resizing{cursor:ew-resize;user-select:none}.collapsed .resize-handle{display:none}.title{flex-wrap:wrap;column-gap:8px;row-gap:5px}.title h1{flex:1;min-width:0}.edit-entry{display:flex;align-items:center;gap:4px;font-size:10px;color:#87927c;padding:3px 4px;border-radius:4px}.edit-entry:hover{background:#edf0e6}.edit-entry[aria-pressed=true]{color:var(--green);background:#e9efe2}.edit-hint{display:none;color:#8c9484;font-size:10px;padding:0 18px 8px}.edit-mode .edit-hint{display:block}.editable{outline:0;overflow-wrap:anywhere}.edit-mode .editable{border-radius:3px;box-shadow:0 1px 0 #d8dfcf;cursor:text}.edit-mode .editable:focus{background:#eff3e7;box-shadow:0 1px 0 var(--green)}.edit-mode .editable:empty:before{content:"填写内容";color:#a7ac9f}.editable-name{display:block;flex:1;min-width:0}.required-toggle{font-size:10px;color:var(--green);padding:2px 5px;border-radius:4px;background:#edf2e7;white-space:nowrap}.delete-row{font-size:14px;color:#b2b7aa;width:17px;padding:0}.delete-row:hover{color:#a56d54}.add-row{padding:3px 1px;font-size:10px;color:#98a38e}.add-row:hover{color:var(--green)}.empty{font-size:10px;color:var(--muted);padding:6px 0}.custom-choice{color:var(--green);font-size:10px;padding:4px 0}.editing-text .row{gap:5px}.collapsed .edit-hint{display:none}@media(max-width:440px){.widget{width:var(--panel-width,100%)}.edit-entry{font-size:9px}.edit-hint{padding-inline:14px}}
</style>
</head><body>
<div class="stage"><section class="widget" aria-label="Worket 候选定义">
<header class="bar"><span class="logo">•‿•</span><span class="brand">Worket</span><span class="bar-label">审阅</span><div class="bar-actions"><button class="icon" id="reset" title="重置示例" aria-label="重置示例"><svg viewBox="0 0 16 16"><path d="M3 6a5 5 0 1 1 0 4M3 2v4h4"/></svg></button><button class="icon" id="collapse" title="收起浮窗" aria-label="收起浮窗"><svg viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button></div></header>
<div class="title"><h1 class="editable" id="work-name" aria-label="工作名称">客户研究报告</h1><span class="count" id="count">2 项待定</span><button class="edit-entry" id="edit-all" aria-pressed="false" title="编辑名称、条目、必填和要求"><svg viewBox="0 0 16 16"><path d="m3 10 7-7 3 3-7 7H3zM9 4l3 3"/></svg><span>编辑全部</span></button></div><div class="edit-hint">点文字修改 · 必填可切换</div>
<main class="content" id="requirements"></main>
<footer class="footer"><div class="footer-status"><span class="steps"><i id="p0"></i><i id="p1"></i></span><span id="status">0/2 已处理</span></div><div class="actions"><button class="secondary" id="save">暂存</button><button class="primary" id="publish" disabled>确认保存</button></div></footer><div class="notice" id="notice" role="status"></div>
<div class="resize-handle" id="resize" role="separator" tabindex="0" aria-orientation="vertical" aria-label="调整浮窗宽度" aria-valuemin="340" aria-valuemax="760" aria-valuenow="410" title="拖动右边缘调整宽度"></div></section></div><div class="prototype">可拖动右边缘 · 示例数据</div>
<script>
// Disposable floating-window prototype. Data and edits stay in this page only.
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=[{key:'inputs',label:'输入',icon:'↳',items:[{id:'customer',text:'客户名称、官网',required:true},{id:'focus',text:'研究重点',required:true},{id:'files',text:'已有客户资料',required:false}]},{key:'deliverables',label:'交付',icon:'↗',items:[{id:'pdf',text:'PDF：概况、需求、沟通切入点'},{id:'excel',text:'Excel 数据明细',issue:0}]},{key:'constraints',label:'约束',icon:'⊙',items:[{id:'sources',text:'优先官网、公告等一手资料'},{id:'truth',text:'区分事实与判断，缺失信息标“待核实”'}]},{key:'acceptance',label:'验收',icon:'✓',items:[{id:'check',text:'结论有来源，覆盖指定研究重点'}]},{key:'methods',label:'方法',icon:'⇢',items:[{id:'outline',text:'大纲确认 → 撰写全文',issue:1}]}];
let groups=structuredClone(initial),answers=[null,null],choiceOpen=[false,false],evidence=[false,false],customized=[false,false],editMode=false,published=false,name='客户研究报告',removedItems=[];
const quoteIcon='<svg viewBox="0 0 16 16"><path d="M3 3.5h10v7H7l-3 2v-2H3z"/><path d="M5.5 6h5M5.5 8h3"/></svg>';
const issues=[{question:'每次都要？',choices:['每次必交','按次选择','不纳入'],quote:'<mark>这次客户</mark>还需要 Excel，方便他们自己筛选。',origin:'用户 · 记录 02',results:['每次必交','按需交付','已移出定义','采用自定义内容']},{question:'必须等待？',choices:['必须确认','仅供参考','不纳入'],quote:'<mark>我建议</mark>先确认大纲，再展开全文。',origin:'AI · 记录 01',results:['必须确认','仅供参考','已移出定义','采用自定义内容']}];
function findItem(id){return groups.flatMap(g=>g.items).find(i=>i.id===id)}
function itemText(item){return '<span class="editable editable-name" data-text="'+esc(item.id)+'" '+(editMode?'contenteditable="true" role="textbox" aria-label="条目：'+esc(item.text||'新条目')+'"':'')+'>'+esc(item.text)+'</span>'}
function row(item){let controls=typeof item.required==='boolean'?(editMode?'<button class="required-toggle" data-required="'+item.id+'" aria-label="'+esc(item.text||'新条目')+'：'+(item.required?'必填':'选填')+'，点击切换">'+(item.required?'必填':'选填')+' ⇅</button>':'<span class="meta">'+(item.required?'必填':'选填')+'</span>'):'';if(editMode)controls+='<button class="delete-row" data-delete="'+item.id+'" aria-label="删除'+esc(item.text||'新条目')+'" title="删除条目">×</button>';
if(item.issue===undefined)return '<div class="row"><div class="row-text">'+itemText(item)+'</div>'+controls+'</div>';
let i=item.issue,q=issues[i],a=answers[i];return '<div class="item '+(a!==null?'resolved ':'')+(a===2?'removed':'')+'"><div class="row"><div class="row-text issue-name"><span class="dot"></span>'+itemText(item)+'</div>'+(!editMode&&a===null?'<span class="meta">'+q.question+'</span>':'')+'<button class="evidence-button" data-evidence="'+i+'" aria-label="'+esc(item.text)+'的原文" aria-expanded="'+evidence[i]+'" title="查看原文">'+quoteIcon+'</button>'+controls+'</div>'+(evidence[i]?'<div class="evidence">'+q.origin+'<p>“'+q.quote+'”</p></div>':'')+((a===null||choiceOpen[i])&&!published?'<div class="choices" role="group" aria-label="'+esc(item.text)+'的处理方式">'+q.choices.map((c,j)=>'<button data-choice="'+i+','+j+'" class="'+(a===j?'chosen':'')+'">'+c+'</button>').join('')+'</div>':a!==null?'<div class="decision"><button class="chip" data-edit="'+i+'" '+(published?'disabled':'')+'>✓ '+q.results[a]+'</button>'+(!published?'<button class="undo" data-undo="'+i+'" aria-label="撤销'+esc(item.text)+'的决定" title="撤销">↶</button>':'')+'</div>':'')+'<button class="custom-choice" data-custom="'+i+'" '+(editMode&&customized[i]&&a===null?'':'hidden')+'>采用修改后的内容 ✓</button></div>'}
function status(){let done=answers.filter(a=>a!==null).length;$('#count').textContent=published?'已保存':done===2?'待确认':(2-done)+' 项待定';$('#status').textContent=published?'已保存 · 演示':done+'/2 已处理';$('#publish').disabled=done!==2||published||editMode;$('#publish').textContent=published?'已保存':'确认保存';$('#edit-all').disabled=published;$('.widget').classList.toggle('published',published);[0,1].forEach(i=>$('#p'+i).classList.toggle('done',answers[i]!==null));}
function render(){const scroll=$('#requirements').scrollTop;$('.widget').classList.toggle('edit-mode',editMode);$('#work-name').textContent=name;$('#work-name').contentEditable=String(editMode);$('#edit-all').setAttribute('aria-pressed',String(editMode));$('#edit-all span').textContent=editMode?'完成编辑':'编辑全部';$('#requirements').innerHTML=groups.map(g=>'<section class="group"><span class="label"><span class="label-icon" aria-hidden="true">'+g.icon+'</span>'+g.label+'</span><div class="items">'+g.items.map(row).join('')+(!g.items.length&&!editMode?'<div class="empty">未设置</div>':'')+(editMode?'<button class="add-row" data-add="'+g.key+'">＋ 添加'+g.label+'</button>':'')+'</div></section>').join('');$('#requirements').scrollTop=scroll;status();bindRows();}
function syncConditional(){let g=groups[0];if(answers[0]===1&&!g.items.some(i=>i.id==='excel-input'))g.items.push({id:'excel-input',text:'是否交付 Excel',required:true});if(answers[0]!==1)g.items=g.items.filter(i=>i.id!=='excel-input');}
function validateEdits(){if(!name.trim()){showNotice('请填写工作名称');$('#work-name').focus();return false}let empty=groups.flatMap(g=>g.items).find(i=>!i.text.trim());if(empty){showNotice('请填写空白条目，或将它删除');document.querySelector('[data-text="'+empty.id+'"]').focus();return false}return true}
function showNotice(t){$('#notice').textContent=t}
function bindRows(){document.querySelectorAll('[data-text]').forEach(el=>{el.oninput=()=>{let item=findItem(el.dataset.text);item.text=el.textContent.replace(/\n/g,' ');if(item.issue!==undefined){let i=item.issue;customized[i]=true;answers[i]=null;choiceOpen[i]=false;el.closest('.item').querySelector('[data-custom]').hidden=false;status()}showNotice('')};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}};el.onpaste=e=>{if(!editMode)return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain').replace(/\s*\n\s*/g,' '))}});
document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{let [i,j]=el.dataset.choice.split(',').map(Number);answers[i]=j;choiceOpen[i]=false;syncConditional();showNotice('');render()});document.querySelectorAll('[data-evidence]').forEach(el=>el.onclick=()=>{let i=+el.dataset.evidence;evidence[i]=!evidence[i];render()});document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{choiceOpen[+el.dataset.edit]=true;render()});document.querySelectorAll('[data-undo]').forEach(el=>el.onclick=()=>{let i=+el.dataset.undo;answers[i]=null;choiceOpen[i]=false;syncConditional();showNotice('');render()});document.querySelectorAll('[data-required]').forEach(el=>el.onclick=()=>{let item=findItem(el.dataset.required);item.required=!item.required;render()});document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{let item=findItem(el.dataset.delete),g=groups.find(g=>g.items.includes(item));removedItems.push({group:g.key,item:structuredClone(item),index:g.items.indexOf(item),answer:item.issue!==undefined?answers[item.issue]:null});g.items=g.items.filter(i=>i!==item);if(item.issue!==undefined){answers[item.issue]=2;syncConditional()}render();$('#notice').innerHTML='已删除条目 <button class="secondary" id="restore">撤销</button>';$('#restore').onclick=()=>{let r=removedItems.pop(),g=groups.find(g=>g.key===r.group);g.items.splice(r.index,0,r.item);if(r.item.issue!==undefined)answers[r.item.issue]=r.answer;syncConditional();showNotice('');render()}});document.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{let g=groups.find(g=>g.key===el.dataset.add),id='new-'+crypto.randomUUID();g.items.push({id,text:'',...(g.key==='inputs'?{required:true}:{})});render();document.querySelector('[data-text="'+id+'"]').focus()});document.querySelectorAll('[data-custom]').forEach(el=>el.onclick=()=>{if(!validateEdits())return;answers[+el.dataset.custom]=3;syncConditional();render()});}
$('#work-name').oninput=()=>{name=$('#work-name').textContent.replace(/\n/g,' ');showNotice('')};$('#work-name').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}};$('#edit-all').onclick=()=>{if(editMode&&!validateEdits())return;editMode=!editMode;showNotice('');render()};$('#save').onclick=()=>{if(!validateEdits())return;showNotice('已暂存于本次演示，刷新会重置')};$('#publish').onclick=()=>{if(editMode||answers.some(a=>a===null)||!validateEdits())return;published=true;choiceOpen=[false,false];render();showNotice('演示已保存，未写入真实工作库')};$('#reset').onclick=()=>{groups=structuredClone(initial);answers=[null,null];choiceOpen=[false,false];evidence=[false,false];customized=[false,false];editMode=false;published=false;removedItems=[];name='客户研究报告';showNotice('');render()};$('#collapse').onclick=()=>{let collapsed=$('.widget').classList.toggle('collapsed');$('#collapse').setAttribute('aria-label',collapsed?'展开浮窗':'收起浮窗');$('#collapse').title=collapsed?'展开浮窗':'收起浮窗';$('#collapse').innerHTML='<svg viewBox="0 0 16 16"><path d="M4 8h8'+(collapsed?'M8 4v8':'')+'"/></svg>'};
const handle=$('#resize'),widget=$('.widget');let drag=null;
function limits(){let left=$('.stage').getBoundingClientRect().left,max=Math.max(260,Math.min(760,window.innerWidth-left-14));return {min:Math.min(340,max),max}}
function setWidth(width){let {min,max}=limits(),w=Math.round(Math.max(min,Math.min(max,width)));widget.style.setProperty('--panel-width',w+'px');handle.setAttribute('aria-valuenow',w);handle.setAttribute('aria-valuemin',min);handle.setAttribute('aria-valuemax',Math.floor(max));}
handle.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();drag={x:e.clientX,width:widget.getBoundingClientRect().width};handle.setPointerCapture(e.pointerId);document.body.classList.add('resizing')};handle.onpointermove=e=>{if(drag)setWidth(drag.width+e.clientX-drag.x)};function finish(){drag=null;document.body.classList.remove('resizing')}handle.onpointerup=finish;handle.onpointercancel=finish;handle.onlostpointercapture=finish;handle.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();let {min,max}=limits();setWidth(e.key==='Home'?min:e.key==='End'?max:widget.getBoundingClientRect().width+(e.key==='ArrowRight'?20:-20))}};window.addEventListener('resize',()=>setWidth(parseInt(widget.style.getPropertyValue('--panel-width'))||410));setWidth(410);render();
</script></body></html>
