<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worket · 浮窗审阅</title>
<style>
:root{--paper:#fbfaf7;--ink:#343d36;--muted:#92968c;--line:#e8e8e0;--green:#38634b;--amber:#aa7b39;--soft:#f5eedf}*{box-sizing:border-box}body{margin:0;background:#eaece7;color:var(--ink);font:12px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;height:100dvh;display:grid;place-items:center;padding:20px}button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}button:focus-visible{outline:2px solid var(--green);outline-offset:2px}button:disabled{opacity:.35;cursor:default}svg{width:13px;height:13px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.widget{width:410px;max-width:100%;max-height:calc(100dvh - 55px);background:var(--paper);border:1px solid #d9ddd3;border-radius:13px;box-shadow:0 18px 60px #24342b1c,0 2px 8px #24342b08;display:flex;flex-direction:column;overflow:hidden}.bar{height:38px;flex-shrink:0;padding:0 17px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line);user-select:none}.logo{width:16px;height:15px;background:#d9c28a;border-radius:44%;font-size:10px;line-height:14px;text-align:center;color:#6c5a35}.brand{font-weight:700;font-size:12px}.bar-label{font-size:10px;color:var(--muted);margin-left:3px}.bar-actions{margin-left:auto;display:flex;gap:9px}.icon{width:22px;height:23px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}.icon:hover{background:#eeefe8;color:var(--ink)}.title{padding:15px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:18px;letter-spacing:-.5px;margin:0;font-weight:650}.count{font-size:10px;color:var(--amber);white-space:nowrap}.content{padding:0 18px 6px;overflow:auto;min-height:0}.group{display:grid;grid-template-columns:39px minmax(0,1fr);border-top:1px solid var(--line)}.label{font-size:10px;color:var(--muted);padding-top:10px}.items{padding:4px 0;min-width:0}.row{display:flex;align-items:center;gap:6px;min-height:29px}.row-text{flex:1;min-width:0;font-size:12px}.meta{font-size:10px;color:#969b90;white-space:nowrap}.item{padding:6px 0}.item .row{min-height:22px}.issue-name{display:flex;gap:6px;align-items:center}.dot{width:4px;height:4px;background:var(--amber);border-radius:50%;flex-shrink:0}.resolved .dot{background:#91a086}.evidence-button{color:#a6a99e;flex-shrink:0;width:22px;height:22px;display:grid;place-items:center;border-radius:4px}.evidence-button:hover,.evidence-button[aria-expanded=true]{background:#eceee5;color:var(--green)}.choices{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #e5dece;border-radius:5px;background:#f8f4e9;margin-top:5px;overflow:hidden}.choices button{font-size:10px;padding:5px 1px;white-space:nowrap;line-height:1.5}.choices button+button{border-left:1px solid #e5dece}.choices button:hover{background:#ece6d6}.choices button.chosen{background:#e2eadc;color:var(--green)}.decision{display:flex;align-items:center;gap:4px;margin-top:4px}.decision .chip{font-size:10px;padding:2px 6px;background:#eaf0e5;color:var(--green);border-radius:4px}.decision .chip:hover{background:#dfe9d7}.undo{font-size:12px;color:#b0b4a9;padding:1px 4px;line-height:18px}.undo:hover{color:var(--ink)}.evidence{background:#f0f1eb;border-radius:5px;font-size:10px;color:#78816f;padding:8px 10px;margin-top:6px}.evidence p{margin:3px 0 0;color:#586151;line-height:1.6}.evidence mark{background:#e5dfb9;color:inherit;padding:0 2px}.extra{color:var(--green)}.removed .row-text{text-decoration:line-through;color:#a3a698}.footer{flex-shrink:0;border-top:1px solid var(--line);padding:11px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px}.footer-status{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}.steps{display:flex;gap:3px}.steps i{width:9px;height:3px;border-radius:2px;background:#dddccb}.steps i.done{background:#6e8d65}.actions{display:flex;gap:8px}.secondary{padding:5px 7px;font-size:11px;color:#7f8977}.primary{border-radius:5px;background:var(--green);color:white;font-size:11px;padding:6px 13px}.primary:hover:not(:disabled){background:#2b513c}.prototype{position:fixed;bottom:9px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2px;color:#9b9e95;pointer-events:none}.notice{font-size:10px;color:var(--green);text-align:center;padding:0 18px 9px}.notice:empty{display:none}.collapsed .title,.collapsed .content,.collapsed .footer,.collapsed .notice{display:none}.collapsed .bar{border:0}.collapsed{width:170px}.widget.published .count{color:var(--green)}@media(max-width:440px){body{padding:12px}.widget{width:100%}.content{padding-inline:14px}.title{padding-inline:14px}.group{grid-template-columns:34px}.row-text{font-size:11px}.meta{font-size:9px}}@media(max-height:640px){.bar{height:33px}.title{padding-block:10px}.row{min-height:25px}.items{padding-block:3px}.item{padding-block:4px}.footer{padding-block:8px}}
</style>
</head><body>
<section class="widget" aria-label="Worket 候选定义">
<header class="bar"><span class="logo">•‿•</span><span class="brand">Worket</span><span class="bar-label">审阅</span><div class="bar-actions"><button class="icon" id="reset" title="重置示例" aria-label="重置示例"><svg viewBox="0 0 16 16"><path d="M3 6a5 5 0 1 1 0 4M3 2v4h4"/></svg></button><button class="icon" id="collapse" title="收起浮窗" aria-label="收起浮窗"><svg viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button></div></header>
<div class="title"><h1>客户研究报告</h1><span class="count" id="count">2 项待定</span></div>
<main class="content">
<section class="group"><span class="label">输入</span><div class="items"><div class="row"><span class="row-text">客户名称、官网</span><span class="meta">必填</span></div><div class="row"><span class="row-text">研究重点</span><span class="meta">必填</span></div><div class="row"><span class="row-text">已有客户资料</span><span class="meta">选填</span></div><div id="extra-input"></div></div></section>
<section class="group"><span class="label">交付</span><div class="items"><div class="row"><span class="row-text">PDF：概况、需求、沟通切入点</span></div><div id="issue0"></div></div></section>
<section class="group"><span class="label">约束</span><div class="items"><div class="row"><span class="row-text">优先官网、公告等一手资料</span></div><div class="row"><span class="row-text">区分事实与判断，缺失信息标“待核实”</span></div></div></section>
<section class="group"><span class="label">验收</span><div class="items"><div class="row"><span class="row-text">结论有来源，覆盖指定研究重点</span></div></div></section>
<section class="group"><span class="label">方法</span><div class="items"><div id="issue1"></div></div></section>
</main>
<footer class="footer"><div class="footer-status"><span class="steps"><i id="p0"></i><i id="p1"></i></span><span id="status">0/2 已处理</span></div><div class="actions"><button class="secondary" id="save">暂存</button><button class="primary" id="publish" disabled>确认保存</button></div></footer><div class="notice" id="notice" role="status"></div>
</section><div class="prototype">410 px 浮窗 · 示例数据</div>
<script>
// Disposable compact floating-window prototype. All decisions stay in memory.
const $=s=>document.querySelector(s);let answers=[null,null],editing=[false,false],evidence=[false,false],published=false;
const quotesIcon='<svg viewBox="0 0 16 16"><path d="M3 3.5h10v7H7l-3 2v-2H3z"/><path d="M5.5 6h5M5.5 8h3"/></svg>';
const issues=[{name:'Excel 数据明细',question:'每次都要？',choices:['每次必交','按次选择','不纳入'],quote:'<mark>这次客户</mark>还需要 Excel，方便他们自己筛选。',origin:'用户 · 记录 02',results:['每次必交','按需交付','已移出定义']},{name:'大纲确认 → 撰写全文',question:'必须等待？',choices:['必须确认','仅供参考','不纳入'],quote:'<mark>我建议</mark>先确认大纲，再展开全文。',origin:'AI · 记录 01',results:['必须确认','仅供参考','已移出定义']}];
function renderIssue(i){let issue=issues[i],answer=answers[i];$('#issue'+i).innerHTML='<div class="item '+(answer!==null?'resolved ':'')+(answer===2?'removed':'')+'"><div class="row"><div class="row-text issue-name"><span class="dot"></span><span>'+issue.name+'</span></div>'+(answer===null?'<span class="meta">'+issue.question+'</span>':'')+'<button class="evidence-button" data-evidence="'+i+'" aria-label="'+issue.name+'的原文" aria-expanded="'+evidence[i]+'" title="查看原文">'+quotesIcon+'</button></div>'+(evidence[i]?'<div class="evidence">'+issue.origin+'<p>“'+issue.quote+'”</p></div>':'')+((answer===null||editing[i])&&!published?'<div class="choices" role="group" aria-label="'+issue.name+'的处理方式">'+issue.choices.map((c,j)=>'<button data-choice="'+i+','+j+'" class="'+(answer===j?'chosen':'')+'">'+c+'</button>').join('')+'</div>':answer!==null?'<div class="decision"><button class="chip" data-edit="'+i+'" '+(published?'disabled':'')+' title="修改选择">✓ '+issue.results[answer]+'</button>'+(!published?'<button class="undo" data-undo="'+i+'" aria-label="撤销'+issue.name+'的决定" title="撤销">↶</button>':'')+'</div>':'')+'</div>'}
function render(){[0,1].forEach(renderIssue);let done=answers.filter(a=>a!==null).length;$('#count').textContent=published?'已保存':done===2?'待确认':(2-done)+' 项待定';$('#status').textContent=published?'已保存 · 演示':done+'/2 已处理';$('#publish').disabled=done!==2||published;$('#publish').textContent=published?'已保存':'确认保存';$('.widget').classList.toggle('published',published);[0,1].forEach(i=>$('#p'+i).classList.toggle('done',answers[i]!==null));$('#extra-input').innerHTML=answers[0]===1?'<div class="row extra"><span class="row-text">是否交付 Excel</span><span class="meta">是 / 否 · 必选</span></div>':'';
document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{let [i,j]=el.dataset.choice.split(',').map(Number);answers[i]=j;editing[i]=false;$('#notice').textContent='';render()});document.querySelectorAll('[data-evidence]').forEach(el=>el.onclick=()=>{let i=+el.dataset.evidence;evidence[i]=!evidence[i];render()});document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{editing[+el.dataset.edit]=true;render()});document.querySelectorAll('[data-undo]').forEach(el=>el.onclick=()=>{let i=+el.dataset.undo;answers[i]=null;editing[i]=false;$('#notice').textContent='';render()})}
$('#save').onclick=()=>{$('#notice').textContent='已暂存于本次演示，刷新会重置'};$('#publish').onclick=()=>{if(answers.some(a=>a===null))return;published=true;editing=[false,false];render();$('#notice').textContent='演示已保存，未写入真实工作库'};$('#reset').onclick=()=>{answers=[null,null];editing=[false,false];evidence=[false,false];published=false;$('#notice').textContent='';render()};$('#collapse').onclick=()=>{let collapsed=$('.widget').classList.toggle('collapsed');$('#collapse').setAttribute('aria-label',collapsed?'展开浮窗':'收起浮窗');$('#collapse').title=collapsed?'展开浮窗':'收起浮窗';$('#collapse').innerHTML='<svg viewBox="0 0 16 16"><path d="M4 8h8'+(collapsed?'M8 4v8':'')+'"/></svg>'};render();
</script></body></html>
