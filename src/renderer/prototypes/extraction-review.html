<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worket · 审阅</title><style>
:root{--paper:#faf9f5;--bg:#efeee8;--ink:#2b3730;--muted:#899087;--line:#dedfd5;--green:#34664f;--amber:#a9752e;--soft:#f7edda}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 11px}button:hover{background:#e9eee5}button:focus-visible{outline:2px solid var(--green);outline-offset:2px}button:disabled{opacity:.4;cursor:default}.shell{max-width:1160px;height:100dvh;min-height:530px;margin:auto;background:var(--paper);display:grid;grid-template-rows:49px 88px minmax(0,1fr) 58px;border-inline:1px solid var(--line)}header{display:flex;align-items:center;padding:0 24px;gap:24px;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:750;letter-spacing:-.7px}.logo{display:inline-flex;align-items:center;justify-content:center;width:25px;height:23px;margin-right:8px;border-radius:45%;background:#dfca8d;font-size:14px;color:#79632e}header nav{font-size:12px;color:var(--muted)}.demo{margin-left:auto;font-size:10px;color:var(--muted)}.head{padding:18px 25px;display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:23px;letter-spacing:-.6px;margin:0 0 5px}p{margin:0}.sub{font-size:12px;color:#858a80}.head-right{display:flex;gap:7px;align-items:center}.tag{display:inline-block;font-size:11px;border-radius:5px;padding:5px 9px;background:#edeFE7;color:#717e6d}.tag.amber{background:var(--soft);color:var(--amber)}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:0;border-top:1px solid var(--line)}.sheet{padding:14px 25px;overflow:auto;min-width:0}.legend{display:flex;gap:14px;color:var(--muted);font-size:10px;margin-bottom:12px}.legend span:last-child{margin-left:auto}.dot{color:var(--amber)}.group{display:grid;grid-template-columns:67px minmax(0,1fr);border-top:1px solid var(--line)}.group-label{padding:12px 0;font-size:11px;color:#778477;display:flex;gap:6px}.group-content{min-width:0;padding:3px 0}.row{min-height:36px;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:5px}.row+.row{border-top:1px solid #ecece5}.text{flex:1;min-width:0}.attr{font-size:10px;color:var(--muted);white-space:nowrap}.origin{font-size:11px;color:#95a290}.issue-row{background:#faf1df!important;color:#725929;border:1px solid #eddfc4!important;width:100%;text-align:left}.issue-row.selected{box-shadow:inset 3px 0 var(--amber)}.issue-row.done{background:#edf2e8!important;border-color:#d6e1cd!important;color:var(--green);box-shadow:none}.state{font-size:10px;white-space:nowrap}.deleted{text-decoration:line-through;opacity:.65}.aside{border-left:1px solid var(--line);background:#f4f4ed;overflow:auto;padding:17px 19px}.aside-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.aside-title strong{font-size:12px}.tabs{display:flex;gap:5px}.tabs button{font-size:11px;padding:3px 9px;border-radius:4px}.tabs button.active{background:var(--ink);color:white;border-color:var(--ink)}h2{font-size:18px;line-height:1.4;margin:0 0 7px;letter-spacing:-.4px}.why{font-size:11px;color:#8d8370;margin-bottom:14px}.quote{font-size:12px;padding:11px 12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;margin-bottom:12px;line-height:1.6}.quote small{font-size:10px;color:var(--muted);display:block;margin-bottom:5px}.quote mark{background:#efe0b9;color:inherit;padding:1px 2px}details{margin-top:7px;font-size:10px;color:var(--muted)}summary{cursor:pointer}details p{margin-top:7px}.options{display:grid;gap:7px}.option{display:flex;align-items:center;justify-content:space-between;background:var(--paper);text-align:left;padding:10px 11px}.option small{font-size:10px;color:var(--muted)}.option.checked{border-color:#7c9b76;background:#e8f0e3;color:var(--green)}.result{font-size:11px;color:var(--green);margin-top:12px;min-height:30px}.link{border:0;color:var(--muted);padding:3px 0;font-size:11px}.aside-bottom{display:flex;justify-content:space-between;margin-top:8px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#284e3b}.footer{border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 24px;gap:12px}.footer-left{display:flex;align-items:center;gap:9px;font-size:12px}.progress{display:flex;gap:3px}.progress i{display:block;width:18px;height:4px;border-radius:2px;background:#e4ddcb}.progress i.filled{background:var(--green)}.footer-right{display:flex;gap:8px}.saved{font-size:11px;color:var(--green)}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 20px;border-radius:7px;z-index:5}.toast:empty{display:none}@media(min-height:780px){.shell{max-height:740px;margin:calc((100dvh - 740px)/2) auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 15px 60px #243d2410}}@media(max-width:760px){.shell{grid-template-rows:44px 77px minmax(0,1fr) 58px}header{padding-inline:15px}.head{padding:12px 15px}main{grid-template-columns:minmax(0,1fr) 265px}.sheet{padding:12px}.aside{padding:14px}.group{grid-template-columns:45px minmax(0,1fr)}.attr{display:none}.row{font-size:12px}.legend span:last-child{display:none}.tag{font-size:10px}h1{font-size:21px}}@media(max-width:570px){main{display:flex;flex-direction:column}.sheet{flex:1;min-height:130px}.aside{flex:none;max-height:45%;border-left:0;border-top:1px solid var(--line);padding:12px 16px}.aside-title{margin-bottom:7px}.quote{display:none}.options{grid-template-columns:repeat(3,1fr);gap:5px}.option{display:block;padding:7px;font-size:11px}.option small{display:block;font-size:9px}.why{margin-bottom:8px}.result{margin-top:7px;min-height:0}.aside-bottom{margin-top:4px}h2{font-size:15px}.head-right .tag:first-child{display:none}.footer{padding:10px 12px}.footer button{padding:7px 9px;font-size:11px}.footer-left{font-size:11px}.demo{font-size:9px}.sub{font-size:11px}}
</style></head><body><div class="shell"><header><div class="brand"><span class="logo">•‿•</span>Worket</div><nav>已沉淀 / 审阅</nav><span class="demo">交互示意 · 示例数据</span></header><section class="head"><div><h1>客户研究报告</h1><p class="sub">用于销售准备，交付有来源的客户分析。</p></div><div class="head-right"><span class="tag">2 份来源</span><span class="tag amber" id="badge">2 项待决定</span><button class="link" id="reset" title="重置演示" aria-label="重置演示">↺</button></div></section><main><section class="sheet"><div class="legend"><span>● 用户提出</span><span>◇ AI 建议</span><span><b class="dot">●</b> 点选黄色条目处理疑点</span></div><div class="group"><div class="group-label">↳ 输入</div><div class="group-content"><div class="row"><span class="text">客户名称、官网</span><span class="attr">必填</span><span class="origin">●</span></div><div class="row"><span class="text">研究重点</span><span class="attr">必填</span><span class="origin">●</span></div><div class="row"><span class="text">已有客户资料</span><span class="attr">选填</span><span class="origin">●</span></div><div id="new-input"></div></div></div><div class="group"><div class="group-label">↗ 交付</div><div class="group-content"><div class="row"><span class="text">PDF 报告：概况、需求、沟通切入点</span><span class="origin">●</span></div><button class="row issue-row" id="excel" data-issue="0"><span class="text" id="excel-text">Excel 数据明细</span><span class="state" id="excel-state">每次都要？ ↗</span></button></div></div><div class="group"><div class="group-label">⊙ 约束</div><div class="group-content"><div class="row"><span class="text">优先官网、公告等一手资料</span><span class="origin">●</span></div><div class="row"><span class="text">区分事实与判断；缺失信息标“待核实”</span><span class="origin">●</span></div></div></div><div class="group"><div class="group-label">✓ 验收</div><div class="group-content"><div class="row"><span class="text">关键结论有来源，覆盖指定研究重点</span><span class="origin">●</span></div></div></div><div class="group"><div class="group-label">⇢ 方法</div><div class="group-content"><button class="row issue-row" id="method" data-issue="1"><span class="text" id="method-text">大纲确认 → 撰写全文</span><span class="state" id="method-state">必须等待？ ↗</span></button></div></div></section><aside class="aside"><div class="aside-title"><strong id="review-label">待决定</strong><div class="tabs"><button id="q0" data-issue="0" aria-label="交付范围">1</button><button id="q1" data-issue="1" aria-label="流程要求">2</button></div></div><div id="decision"></div></aside></main><footer class="footer"><div class="footer-left"><div class="progress"><i id="p0"></i><i id="p1"></i></div><span id="progress-text">0/2 已处理</span><span class="saved" id="draft-status"></span></div><div class="footer-right"><button id="save">暂存</button><button id="publish" class="primary" disabled>确认工作定义</button></div></footer></div><div class="toast" id="toast" role="status"></div><script>
// Disposable single-screen UX prototype. In-memory sample data only; no production mutations.
const $=s=>document.querySelector(s);let answers=[null,null],active=0,published=false,timer;
const issues=[{title:'Excel 每次都要交付？',why:'“这次”需求，不一定适用于以后。',quote:'<mark>这次客户</mark>还需要 Excel，方便他们自己筛选。',speaker:'你 · 记录 02',context:'AI：报告以 PDF 交付。<br>你：这次客户还需要 Excel，方便他们自己筛选。',options:[['每次必交','固定交付'],['按次选择','新增输入项'],['仅限上次','移出定义']],results:['Excel 已设为固定交付。','新增输入：是否需要 Excel。','Excel 已移出定义。']},{title:'每次都先确认大纲？',why:'AI 的建议，尚未得到你的确认。',quote:'<mark>我建议</mark>先确认大纲，再展开全文。',speaker:'AI · 记录 01',context:'你：重点看客户的潜在采购需求。<br>AI：我建议先确认大纲，再展开全文。',options:[['必须确认','固定步骤'],['仅供参考','无需等待'],['不保留','移出定义']],results:['大纲确认已设为必经步骤。','大纲确认已改为参考方法。','此方法已移出定义。']}];
function toast(t){$('#toast').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',2000)}
function render(){let done=answers.filter(x=>x!==null).length;$('#badge').textContent=published?'已保存 · 演示':done===2?'待整体确认':(2-done)+' 项待决定';$('#progress-text').textContent=published?'已确认':done+'/2 已处理';$('#publish').disabled=done!==2||published;$('#publish').textContent=published?'已保存':'确认工作定义';$('#review-label').textContent=answers[active]===null?'待决定':'已决定';[0,1].forEach(i=>{$('#q'+i).classList.toggle('active',active===i);$('#q'+i).textContent=answers[i]===null?i+1:'✓';$('#p'+i).classList.toggle('filled',answers[i]!==null)});const a=answers[0],b=answers[1];$('#excel-text').textContent=a===1?'Excel 数据明细（按本次选择）':'Excel 数据明细';$('#excel-text').classList.toggle('deleted',a===2);$('#excel-state').textContent=a===null?'每次都要？ ↗':a===2?'已移除 ✓':'已决定 ✓';$('#method-text').textContent=b===1?'大纲确认 → 撰写全文（参考）':'大纲确认 → 撰写全文';$('#method-text').classList.toggle('deleted',b===2);$('#method-state').textContent=b===null?'必须等待？ ↗':b===2?'已移除 ✓':'已决定 ✓';$('#new-input').innerHTML=a===1?'<div class="row" style="color:var(--green);background:#edf2e8"><span class="text">是否需要 Excel</span><span class="attr">是 / 否 · 必选</span><span>＋</span></div>':'';['excel','method'].forEach((id,i)=>{$('#'+id).classList.toggle('selected',active===i);$('#'+id).classList.toggle('done',answers[i]!==null)});let q=issues[active],answer=answers[active];$('#decision').innerHTML='<h2>'+q.title+'</h2><p class="why">'+q.why+'</p><div class="quote"><small>'+q.speaker+' · 示例原话</small>“'+q.quote+'”<details><summary>上下文 ↗</summary><p>'+q.context+'</p></details></div><div class="options">'+q.options.map((o,i)=>'<button class="option '+(answer===i?'checked':'')+'" data-answer="'+i+'" '+(published?'disabled':'')+'><span>'+(answer===i?'✓ ':'')+o[0]+'</span><small>'+o[1]+'</small></button>').join('')+'</div><div class="result" role="status">'+(answer!==null?'✓ '+q.results[answer]:'')+'</div><div class="aside-bottom">'+(answer!==null&&!published?'<button class="link" id="undo">↶ 撤销</button>':'<span></span>')+(answers[1-active]===null?'<button class="link" id="next">下一项 →</button>':'')+'</div>';document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{answers[active]=+el.dataset.answer;$('#draft-status').textContent='';render()});if($('#undo'))$('#undo').onclick=()=>{answers[active]=null;$('#draft-status').textContent='';render()};if($('#next'))$('#next').onclick=()=>{active=1-active;render()}}
document.querySelectorAll('[data-issue]').forEach(el=>el.onclick=()=>{active=+el.dataset.issue;render()});$('#save').onclick=()=>{$('#draft-status').textContent='已暂存';toast('仅保留在本次演示，刷新会重置')};$('#publish').onclick=()=>{if(answers.some(a=>a===null))return;published=true;render();toast('已确认工作定义（演示）')};$('#reset').onclick=()=>{answers=[null,null];active=0;published=false;$('#draft-status').textContent='';render()};render();
</script></body></html>
